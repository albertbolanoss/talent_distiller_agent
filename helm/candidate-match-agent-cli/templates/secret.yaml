apiVersion: v1
kind: Secret
metadata:
  name: {{ include "candidate-match-agent-cli.fullname" . }}
  labels:
    {{- include "candidate-match-agent-cli.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Placeholder values - see the comment above `secrets` in values.yaml for how to override
  # these with real credentials at install time instead of committing them here.
  CANDIDATE_MATCH_AGENT_PORTKEY_API_KEY: {{ .Values.secrets.portkeyApiKey | quote }}
  CANDIDATE_MATCH_AGENT_ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
