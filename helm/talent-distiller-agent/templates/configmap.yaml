apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "talent-distiller-agent.fullname" . }}
  labels:
    {{- include "talent-distiller-agent.labels" . | nindent 4 }}
data:
  TALENT_DISTILLER_AGENT_PROVIDER: {{ .Values.config.provider | quote }}
  TALENT_DISTILLER_AGENT_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TALENT_DISTILLER_AGENT_RESUME_DIR: {{ .Values.config.resumeDir | quote }}
  TALENT_DISTILLER_AGENT_RESUME_POLL_INTERVAL_SECONDS: {{ .Values.config.resumePollIntervalSeconds | quote }}
  TALENT_DISTILLER_AGENT_RESUME_MAX_FILES_PER_BATCH: {{ .Values.config.resumeMaxFilesPerBatch | quote }}
  TALENT_DISTILLER_AGENT_DISABLE_PROMPT_CACHING: {{ .Values.config.disablePromptCaching | quote }}
  TALENT_DISTILLER_AGENT_PORTKEY_VIRTUAL: {{ .Values.config.portkeyVirtual | quote }}
  TALENT_DISTILLER_AGENT_SKILL_AGENT_MCP_URL: {{ .Values.config.skillAgentMcpUrl | quote }}
