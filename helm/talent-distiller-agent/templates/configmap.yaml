apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "talent-distiller-agent.fullname" . }}
  labels:
    {{- include "talent-distiller-agent.labels" . | nindent 4 }}
data:
  # --- labs_agent_lib.AgentSettings ---
  LABS_AGENT_LIB_PROVIDER: {{ .Values.config.provider | quote }}
  LABS_AGENT_LIB_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LABS_AGENT_LIB_DISABLE_PROMPT_CACHING: {{ .Values.config.disablePromptCaching | quote }}
  LABS_AGENT_LIB_PORTKEY_VIRTUAL: {{ .Values.config.portkeyVirtual | quote }}

  # --- talent_distiller_agent.settings.Settings: Resume settings ---
  TALENT_DISTILLER_AGENT_RESUME_DIR: {{ .Values.config.resumeDir | quote }}
  TALENT_DISTILLER_AGENT_RESUME_POLL_INTERVAL_SECONDS: {{ .Values.config.resumePollIntervalSeconds | quote }}
  TALENT_DISTILLER_AGENT_RESUME_MAX_FILES_PER_BATCH: {{ .Values.config.resumeMaxFilesPerBatch | quote }}
  TALENT_DISTILLER_AGENT_COORDINATOR_PROCESSED_FOLDER: {{ .Values.config.coordinatorProcessedFolder | quote }}
  TALENT_DISTILLER_AGENT_COORDINATOR_FAILED_FOLDER: {{ .Values.config.coordinatorFailedFolder | quote }}

  # --- talent_distiller_agent.settings.Settings: Job Posting settings ---
  TALENT_DISTILLER_AGENT_JOB_POSTING_DIR: {{ .Values.config.jobPostingDir | quote }}
  TALENT_DISTILLER_AGENT_JOB_POSTING_POLL_INTERVAL_SECONDS: {{ .Values.config.jobPostingPollIntervalSeconds | quote }}
  TALENT_DISTILLER_AGENT_JOB_POSTING_MAX_FILES_PER_BATCH: {{ .Values.config.jobPostingMaxFilesPerBatch | quote }}
  TALENT_DISTILLER_AGENT_JOB_POSTING_PROCESSED_FOLDER: {{ .Values.config.jobPostingProcessedFolder | quote }}
  TALENT_DISTILLER_AGENT_JOB_POSTING_FAILED_FOLDER: {{ .Values.config.jobPostingFailedFolder | quote }}

  # --- talent_distiller_agent.settings.Settings: Shared MCP & Coordinator settings ---
  TALENT_DISTILLER_AGENT_SKILL_AGENT_TECHNICAL_MCP_URL: {{ .Values.config.skillAgentTechnicalMcpUrl | quote }}
  TALENT_DISTILLER_AGENT_SKILL_AGENT_SOFT_MCP_URL: {{ .Values.config.skillAgentSoftMcpUrl | quote }}
  TALENT_DISTILLER_AGENT_SKILL_AGENT_CERTIFICATIONS_MCP_URL: {{ .Values.config.skillAgentCertificationsMcpUrl | quote }}
  TALENT_DISTILLER_AGENT_SKILL_AGENT_LANGUAGES_MCP_URL: {{ .Values.config.skillAgentLanguagesMcpUrl | quote }}
  TALENT_DISTILLER_AGENT_COORDINATOR_MODEL: {{ .Values.config.coordinatorModel | quote }}
  TALENT_DISTILLER_AGENT_COORDINATOR_MAX_REVISION_NUMBER: {{ .Values.config.coordinatorMaxRevisionNumber | quote }}
  TALENT_DISTILLER_AGENT_COORDINATOR_MCP_TOOL_IDLE_TIMEOUT_MS: {{ .Values.config.coordinatorMcpToolIdleTimeoutMs | quote }}  

  # --- talent_distiller_agent.settings.Settings: Redis ---
  TALENT_DISTILLER_AGENT_REDIS_HOST: {{ .Values.config.redisHost | quote }}
  TALENT_DISTILLER_AGENT_REDIS_DB: {{ .Values.config.redisDb | quote }}
