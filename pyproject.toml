[project]
name = "candidate-match-agent"
version = "0.1.0"
description = "This AI agent analyzes job postings against resumes to identify matching skills and rank candidates."
readme = "README.md"
authors = [
    { name = "Luis Alberto Bolaños Salazar", email = "68343185+albertbolanoss@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.15.1",
    "claude-agent-sdk>=0.2.174",
    "docx2txt>=0.9",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
candidate-match-agent = "candidate_match_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=candidate_match_agent --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = [
    # Manual dev entrypoint - edited and run by hand, not part of the tested application surface.
    "src/candidate_match_agent/coordinators/main.py",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "if __name__ == .__main__.:",
]
